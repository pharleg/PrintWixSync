name: Compare Printify vs Wix Products

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and compare products
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_ACCOUNT_ID: ${{ secrets.WIX_ACCOUNT_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import json

          # --- Fetch all Printify products (paginated) ---
          printify_titles = set()
          page = 1
          while True:
              url = f"https://api.printify.com/v1/shops/{PRINTIFY_SHOP_ID}/products.json?limit=50&page={page}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {PRINTIFY_API_KEY}"})
              with urllib.request.urlopen(req) as r:
                  data = json.loads(r.read())
              products = data.get("data", [])
              for p in products:
                  printify_titles.add(p["title"].strip().lower())
              if len(products) < 50:
                  break
              page += 1

          print(f"Printify products found: {len(printify_titles)}")

          # --- Fetch all Wix products (paginated via cursor) ---
          wix_products = []
          cursor = None
          while True:
              body = {"limit": 100}
              if cursor:
                  body["cursorPaging"] = {"cursor": cursor}
              req = urllib.request.Request(
                  "https://www.wixapis.com/stores/v3/products/query",
                  data=json.dumps(body).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": WIX_API_KEY,
                      "wix-site-id": WIX_SITE_ID,
                      "wix-account-id": WIX_ACCOUNT_ID,
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req) as r:
                  data = json.loads(r.read())
              batch = data.get("products", [])
              wix_products.extend(batch)
              cursor = data.get("pagingMetadata", {}).get("cursors", {}).get("next")
              if not cursor or len(batch) == 0:
                  break

          print(f"Wix products found: {len(wix_products)}")

          # --- Find Wix-exclusive products ---
          print("\n--- WIX-EXCLUSIVE PRODUCTS (not in Printify) ---\n")
          wix_only = []
          for p in wix_products:
              title = p.get("name", "").strip()
              if title.lower() not in printify_titles:
                  wix_only.append(title)

          for title in sorted(wix_only):
              print(f"  {title}")

          print(f"\nTotal Wix-exclusive: {len(wix_only)}")

          # --- Also print full Printify list for reference ---
          print("\n--- ALL PRINTIFY PRODUCTS ---\n")
          for t in sorted(printify_titles):
              print(f"  {t}")

          EOF
